[package]
name = "vozen-music"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "voice", "rustls_backend"] }
songbird = "0.6.1"
symphonia = { version = "0.5.5", features = ["mp3"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[lints.rust]
unsafe_code = "forbid"
